# Cloudflare 管理器 —— Web 版一键部署
# 用法：
#   docker compose up -d          # 启动
#   docker compose down           # 停止
#   docker compose up -d --build  # 重新构建
#
# 默认前台端口 8080（浏览器访问 http://localhost:8080）
services:
  cloudflare-manager:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 部署到子路径时修改，例如 /cloudflare/（需同时改 nginx 或外层反代）
        - FLUTTER_BASE_HREF=/
    image: cloudflare-manager:latest
    container_name: cloudflare-manager
    restart: unless-stopped
    ports:
      - "8080:80"          # 宿主机 8080 -> 容器 80
    # 可选：挂载自定义 nginx 配置
    # volumes:
    #   - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s