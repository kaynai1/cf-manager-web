# Cloudflare 管理器 Web 版 —— Nginx 配置
# 提供 gzip、静态资源缓存、SPA history 回退（本应用为单一页面，回退到 index.html）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml image/png image/webp font/woff2;
    gzip_min_length 1024;
    gzip_vary on;

    # 静态资源缓存（带 hash 的 Flutter 产物可长缓存）
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 主应用入口，SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}